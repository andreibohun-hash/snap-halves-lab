<!doctype html>
<html lang="en" data-skin="royal">
<head>
<meta charset="utf-8">
<title>Snap Halves · Lab (500 levels: main; LD mechanics in DEV plan)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8d60fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9).
   v0.9 (аудит графики, мокап GPT): яркий фиолетовый фон; ПАНЕЛЬ ЦЕЛИ — тёплая кремовая с золотой кромкой (заказы, ящики, лоток);
   ПОЛЕ — глубокий сине-фиолетовый лоток. Нужные заказу плитки — из «бумаги» карточек с оранжевой кромкой. Одна тема (тёмной нет: средние тона). */
:root{
  --bg:#4b34b8; --frame:#7552ee; --frame-top:#8d60fa; --ink:#ffffff; --muted:#e3dcff;
  --accent:#fb7f12; --off:rgba(255,255,255,.16); --danger:#ff4f5e;
  --board:#302d94; --board-shadow:#211e6e; --slot:#423db0; --tile:#fbf8fa; --tile-shadow:#bcb3cf; --stone:#8d93bd; --stone-dark:#6f75a3;
  --c0:#ff5470; --c1:#3b8cff; --c2:#ffb81f; --c3:#2fbf71; --c4:#9b5cff;
  --paper:#fff4d2; --paper-shadow:#e0a94f; --panel-ink:#5a3a1c; --panel-muted:#b3a487; --panel-slot:#f2dcaa;   /* карточка заказа: бумага, её бортик, чернила, лунка */
  --goal:#fde7ae; --goal-shadow:#c8893a; --goal-rim:#ffd75e;                                                  /* панель цели (заказы + лоток): кремовая, золотая кромка, бортик */
  --tray-deep:#c98a45; --tray-bed:#ebb36f; --tray-slot:#f6d39a;                                              /* лоток в панели: кромка, дно, лунка */
  --ghost:#8fe8ff;                                                                                           /* призрак раздачи: голубой пунктир (оранжевое — «нужно заказу») */
  --tray:#ff9a1f;                                                                                             /* лоток: «осталось одно место» */
  --chip:#ffffff; --chip-shadow:rgba(90,50,10,.25);                                                           /* фишка: целая фигура на белом кружке */
  --btn-g:#35c46a; --btn-g-d:#1f8f48; --btn-r:#ff5464; --btn-r-d:#c4303f; --btn-n:#6c76c6; --btn-n-d:#4a5396;   /* кнопки: хорошее, негативное, нейтральное и их «бортики» */
  --btn-b:#4fb0ff; --btn-b-d:#1462d8;                                                                        /* бустеры и шестерёнка — синие объёмные (мокап) */
  --honey:#f7b733; --wood:#c98b4f; --wood-dark:#8f5a2b; --steel:#7d8494; --ok:#2fbf71; --ok-bg:#d9f5e4;
  --frame-w:430px;
}
/* Свой шрифт файлом (замечание бота Proto-vibe): Nunito, латиница, OFL — FONTS-LICENSE.txt рядом с файлом шрифта; в сборке для стора — data-URI */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 'Nunito', system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;background:linear-gradient(180deg,var(--frame-top),var(--frame) 45%,#6a4be6);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px 16px;pointer-events:none;min-height:50px}
header b{font-size:20px;font-weight:900}
header b i{font-style:normal;font-size:12px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--danger);border-radius:8px;padding:2px 7px;margin-left:8px;vertical-align:3px}
header button{pointer-events:auto}
.gear{display:flex;align-items:center;justify-content:center;width:46px;height:44px;padding:0;border-radius:14px;background:linear-gradient(180deg,#6cc0ff,var(--btn-b));color:#fff;
  box-shadow:0 5px 0 var(--btn-b-d);transition:transform .06s,box-shadow .06s}
.gear:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-b-d)}
.gear svg{width:26px;height:26px;display:block}
.card .gear{position:absolute;right:12px;top:12px}
#game{flex:1;position:relative;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#boosts{display:flex;gap:14px;justify-content:center;padding:0 14px 2px}
#boosts.hide{display:none}
.boost{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:56px;padding:0;border-radius:18px;background:linear-gradient(180deg,#7fcaff,var(--btn-b));box-shadow:0 6px 0 var(--btn-b-d),0 10px 14px rgba(20,10,80,.3);transition:transform .06s,box-shadow .06s}
.boost:active{transform:translateY(5px);box-shadow:0 1px 0 var(--btn-b-d),0 2px 4px rgba(20,10,80,.3)}
.boost svg{width:32px;height:32px;display:block}
.boost img{height:36px;width:auto;max-width:44px;display:block;pointer-events:none;-webkit-user-drag:none}
.boost.dim img{opacity:.4}
.boost b{position:absolute;right:-7px;top:-7px;min-width:24px;padding:2px 6px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.boost b.ad{background:var(--btn-g);display:flex;align-items:center;gap:2px}
.boost b.ad svg,.adico{width:11px;height:11px;display:inline-block;vertical-align:-1px}
#boosts.pulse .boost{animation:bpulse 1s ease-in-out infinite}
.boost.dim svg{opacity:.4}                                          /* Undo: отменять нечего */   /* бустеры появились впервые — кнопки «дышат», текста нет */
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#frame>#boosts{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--off);border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.45}
/* v0.9: все кнопки объёмные — тень-«бортик» снизу, при нажатии кнопка проседает (сдвиг + тень короче), звук press.
   Цвет по смыслу: g — хорошее и спасительное (Next, Continue, Watch, Resume), r — негативное, куда не зовём (Restart, Quit, No thanks, Retry рядом с Continue),
   n — нейтральное (настройки, вспомогательное). */
.btn{--bc:var(--btn-n);--bs:var(--btn-n-d);position:relative;color:#fff;font-weight:900;background:var(--bc);border-radius:16px;padding:12px 20px;
  box-shadow:0 6px 0 var(--bs),0 9px 14px rgba(20,22,60,.28);transform:translateY(0);transition:transform .06s,box-shadow .06s;text-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn::after{content:'';position:absolute;left:12px;right:12px;top:4px;height:24%;max-height:12px;border-radius:12px;background:rgba(255,255,255,.2);pointer-events:none}   /* блик сверху */
.btn:active,.btn.down{transform:translateY(5px);box-shadow:0 1px 0 var(--bs),0 3px 6px rgba(20,22,60,.25)}
.btn.g{--bc:var(--btn-g);--bs:var(--btn-g-d)} .btn.r{--bc:var(--btn-r);--bs:var(--btn-r-d)} .btn.n{--bc:var(--btn-n);--bs:var(--btn-n-d)}
.btn.small{font-size:15px;padding:9px 18px;border-radius:13px;box-shadow:0 4px 0 var(--bs),0 6px 10px rgba(20,22,60,.25)}
.btn.small:active,.btn.small.down{transform:translateY(3px);box-shadow:0 1px 0 var(--bs)}
.btn.late{visibility:hidden} .btn.late.in{visibility:visible;animation:btnIn .5s cubic-bezier(.25,1.8,.5,1) both}
@keyframes btnIn{from{transform:scale(.55)}to{transform:scale(1)}}   /* старт с видимого состояния (§9): кнопку показывает JS через задержку, а не opacity:0 */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,22,50,.6);padding:20px}
#overlay.show{display:flex}
.card{position:relative;background:var(--frame);border-radius:20px;padding:22px;max-width:340px;width:100%;max-height:100%;overflow-y:auto;text-align:center;
  animation:pop .18s ease-out} /* стартует с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 8px;font-weight:900} .card p{color:var(--muted);margin:0 0 16px}
.card .title{font-size:34px;font-weight:1000;letter-spacing:.01em;margin:6px 0 4px}
.card .logo{width:130px;height:78px;margin:4px auto 2px;display:block}
button.big{font-size:22px;font-weight:1000;padding:16px 26px;border-radius:18px;min-width:220px}
.opts{display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.opts button{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;padding:12px 16px}
.opts button b{font-size:14px;padding:3px 10px;border-radius:10px;background:var(--btn-g);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.opts button b.off{background:rgba(0,0,0,.18);color:#dfe2ff}
.opts button.quiet{justify-content:center}
/* вин-скрин v0.9: без звёзд — «Well done!», собранные фигуры подпрыгивают, Next появляется с задержкой и пружинит */
.card.winc{background:linear-gradient(180deg,#9a74ff,#6c4ce8);box-shadow:0 10px 0 #4a32b0,0 18px 30px rgba(10,10,40,.4);padding:26px 20px 24px;overflow:visible}
.card .wlv{font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#dfe2ff;opacity:.85}
.card .wd{font-size:46px;line-height:1.02;font-weight:1000;margin:6px 0 4px;color:#fff;text-shadow:0 4px 0 #4a32b0;animation:wdIn .55s cubic-bezier(.25,1.7,.5,1) both}
@keyframes wdIn{from{transform:scale(.6) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
.card .figs{display:flex;justify-content:center;gap:6px;margin:14px 0 22px;min-height:60px;flex-wrap:wrap}
.card .figs .fg{position:relative;width:52px;height:56px;animation:hop .6s cubic-bezier(.3,.0,.5,1) both;animation-iteration-count:3}
.card .figs .fg canvas{width:52px;height:52px;display:block}
.card .figs .fg b{position:absolute;right:-4px;bottom:0;font-size:13px;font-weight:1000;background:#fff;color:var(--panel-ink);border-radius:9px;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) scale(1.06,.96)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:translateY(0)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#overlay{z-index:10}
.card.ad{background:#111;color:#fff} .card.ad .adbig{font-size:64px;font-weight:1000;letter-spacing:.08em;margin:8px 0}
.card.ad .adbar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:12px 0 4px}
.card.ad .adbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:adfill var(--adms,1200ms) linear both}
@keyframes adfill{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
/* Заставка (замечание бота): видна до разбора скриптов; полосу двигает LOADER, обёртке — pfSdk.loadingProgress, на первом кадре — pfSdk.ready() */
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--frame);transition:opacity .3s}
#loading.gone{opacity:0;pointer-events:none}
#loading[hidden]{display:none}
#loading svg{width:150px;height:90px}
#load-title{font-size:32px;font-weight:1000;margin:0}
#load-bar{width:180px;height:8px;border-radius:99px;background:var(--off);overflow:hidden}
#load-fill{height:100%;width:6%;border-radius:99px;background:var(--accent);transition:width .25s ease-out}
#load-logo{display:none}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;max-height:42vh;overflow-y:auto;padding:2px}
.levels .ch{grid-column:1/-1;text-align:left;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.levels button{padding:8px 0;font-size:14px}
.levels button small{display:block;font-size:10px;color:var(--c2)}
.levels button.locked{opacity:.4}
.levels button.hard{box-shadow:inset 0 0 0 2px var(--danger)}
.levels.lab{grid-template-columns:repeat(4,1fr);max-height:52vh}
.levels button em{display:block;font-style:normal;font-size:8.5px;line-height:1.1;font-weight:700;color:var(--muted);margin-top:2px;padding:0 2px;overflow:hidden;max-height:2.3em}
.card .note{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--frame);padding:8px 14px;border-radius:10px;
  pointer-events:none;opacity:.95;transition:opacity .25s;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card, #boosts.pulse .boost, .card .wd, .card .figs .fg, .btn.late.in{animation:none} #toast{transition:none} }
#toast{bottom:96px;font-weight:700}
/* Royal-скин («Королевский глянец», мокап GPT A «золотой свет»): светлый замок в расфокусе фоном, поле — синий бархат в золотой рамке,
   панель цели и лоток — дерево с золотом, фигуры — глянцевые «игрушки» GPT. Механика та же; цвета кода — переменные ниже, арт — assets/royal/. */
html[data-skin=royal]{
  --bg:#3b5fae; --frame:#2a4a9e; --frame-top:#7fb2ea; --muted:#e9eefc; --accent:#f39a1d; --danger:#ff4152;
  --board:#1d2f8c; --board-shadow:#121d5c; --slot:#16246f; --tile:#fbfaf6; --tile-shadow:#b9b5c8;
  --paper:#fff1cf; --paper-shadow:#c98a2f; --panel-ink:#4a2a10; --panel-slot:#f3e8d2;
  --goal:#fbf1dc; --goal-shadow:#c9a25a; --goal-rim:#e2b24a; --tray-deep:#e6d2aa; --tray-bed:#f3e6cb; --tray-slot:#fdf7ec;
  --tray:#ff8a00; --chip:#ffffff; --chip-shadow:rgba(60,30,5,.25); --ghost:#2f7fe0;
  --btn-g:#3fca4c; --btn-g-d:#1d8a2c; --btn-r:#ff4f57; --btn-r-d:#b8222e; --btn-n:#6a72b8; --btn-n-d:#424a8a; --btn-b:#2f9cff; --btn-b-d:#1258c4;
}
html[data-skin=royal] body{background:#3b5fae}
html[data-skin=royal] header b{font-size:24px;color:#fff;-webkit-text-stroke:5px #4a2a10;paint-order:stroke fill;text-shadow:0 3px 0 #4a2a10}
html[data-skin=royal] header b i{-webkit-text-stroke:0;text-shadow:none}
html[data-skin=royal] .gear{width:50px;height:50px}
html[data-skin=royal] .gear svg{display:none}
html[data-skin=royal] .boost{width:70px;height:66px}
html[data-skin=royal] .boost img{height:40px;max-width:46px;margin-top:-4px}
html[data-skin=royal] .gear:active,html[data-skin=royal] .boost:active{transform:translateY(4px) scale(.97);box-shadow:none}
html[data-skin=royal] .boost b{border:2px solid #fff;font-weight:1000}
/* кнопки-«конфеты» — спрайты GPT рамкой «9 частей» (border-image): толстые, блик сверху, тёмная кромка; цвет по смыслу тот же */
html[data-skin=royal] .btn::after{display:none}
html[data-skin=royal] .btn:active,html[data-skin=royal] .btn.down{transform:translateY(4px) scale(.98);box-shadow:none;filter:drop-shadow(0 2px 2px rgba(20,22,60,.3))}
html[data-skin=royal] .btn.small{border-width:11px 18px 14px;border-image-width:11px 18px 14px;min-height:44px;box-shadow:none}
html[data-skin=royal] .btn.small:active,html[data-skin=royal] .btn.small.down{transform:translateY(3px);box-shadow:none}
html[data-skin=royal] button.big{min-height:66px}
/* карточки поверх игры — синий бархат в золоте (как поле) */
html[data-skin=royal] #overlay{background:rgba(16,24,70,.55)}
html[data-skin=royal] .card{background:radial-gradient(120% 90% at 50% 30%,#3550b8,#1d2f8c 70%);border:4px solid #ffd35a;box-shadow:0 0 0 3px #a8701c,0 8px 0 3px #6b4310,0 18px 30px rgba(10,10,40,.45)}
html[data-skin=royal] .card.winc{background:radial-gradient(120% 90% at 50% 30%,#3d5cc8,#1d2f8c 72%);box-shadow:0 0 0 3px #a8701c,0 10px 0 3px #6b4310,0 18px 30px rgba(10,10,40,.45)}
html[data-skin=royal] .card .wd{-webkit-text-stroke:6px #6b3a0c;paint-order:stroke fill;color:#ffe066;text-shadow:0 5px 0 #6b3a0c}
html[data-skin=royal] .card h2,html[data-skin=royal] .card .title{-webkit-text-stroke:4px #10195a;paint-order:stroke fill}
html[data-skin=royal] .opts button:not(.btn){background:rgba(8,14,60,.35);box-shadow:inset 0 2px 0 rgba(0,0,0,.2)}
html[data-skin=royal] .card.ad{background:#111;border-color:#333;box-shadow:none}
/* заставка royal (17.11): мгновенный градиент в цветах замка (картинка-замок подтянется из late-стиля), логотип из салюта, полоса в золотой рамке */
html[data-skin=royal] #loading{background:linear-gradient(180deg,#7fb2ea 0%,#bfe0fb 45%,#f4e6cb 100%);gap:26px}
html[data-skin=royal] #loading svg,html[data-skin=royal] #load-title{display:none}
html[data-skin=royal] #load-logo{display:block;width:min(80vw,330px);height:auto;filter:drop-shadow(0 6px 10px rgba(30,40,110,.35));animation:logoIn .5s cubic-bezier(.25,1.7,.5,1) both}
@keyframes logoIn{from{transform:scale(.7)}to{transform:scale(1)}}
html[data-skin=royal] #load-bar{width:min(64vw,240px);height:16px;padding:2px;background:rgba(255,255,255,.6);border:3px solid #e2b24a;box-shadow:0 0 0 2px #a8701c,0 4px 8px rgba(30,40,110,.3)}
html[data-skin=royal] #load-fill{background:linear-gradient(180deg,#ffe98a,#f2a81c);box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}
@media (prefers-reduced-motion: reduce){ html[data-skin=royal] #load-logo{animation:none} }
/* вин-скрин royal (17.11, реф Sand Pop): ночь с салютом (#sky внутри оверлея, под карточкой), потом карточка — лента, плашка, панель с лучами */
html[data-skin=royal] #spot{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:15;touch-action:none}
html[data-skin=royal] #sky{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
html[data-skin=royal] #overlay{transition:background .35s}
html[data-skin=royal] #overlay.night{background:radial-gradient(120% 70% at 50% 100%,#2a1f5c 0%,#0e0b2a 55%,#05040f 100%)}
html[data-skin=royal] #overlay.dusk{background:radial-gradient(120% 80% at 50% 60%,rgba(40,30,100,.72),rgba(8,6,30,.86))}
html[data-skin=royal] .card{z-index:1} html[data-skin=royal] .card.rw-hide{display:none}
/* 18.11: карточки победы нет (Андрей: «вин-попап уберём — просто переход на салют» с фразой) — стиль фразы рисует холст #sky */
/* Ривайв и луз (17.11): оверлей без заливки — тень даёт пятно на причине (лоток или поле, красная пульсирующая кромка), карточка снизу */
html[data-skin=royal] #overlay.lz{background:none;align-items:flex-end;padding:10px 12px max(14px,env(safe-area-inset-bottom))}
html[data-skin=royal] #overlay.lz.failed{background:rgba(12,18,56,.68);align-items:center}
html[data-skin=royal] .lz-hole{position:absolute;z-index:0;pointer-events:none;box-shadow:0 0 0 3000px rgba(12,18,56,.62);animation:lzIn .3s ease-out both}
html[data-skin=royal] .lz-hole::after{content:'';position:absolute;inset:-4px;border-radius:inherit;border:4px solid #ff4458;box-shadow:0 0 18px 4px rgba(255,50,70,.65),inset 0 0 14px rgba(255,50,70,.45);animation:lzPulse .8s ease-in-out 3 alternate both}   /* 18.11: три удара и ровно — меньше тревоги */
@keyframes lzIn{from{box-shadow:0 0 0 3000px rgba(12,18,56,0)}}
@keyframes lzPulse{from{opacity:.5}to{opacity:1}}
html[data-skin=royal] .card.rlose{max-width:330px;padding:36px 14px 12px;margin-top:34px;overflow:visible;animation:rlUp .36s .45s cubic-bezier(.2,1.4,.5,1) both}
html[data-skin=royal] .card.rlose.board,html[data-skin=royal] .card.rlose.timer{animation-delay:.8s}   /* поле забито: сначала видно поле в красной кромке */
html[data-skin=royal] .card.rlose.failed,html[data-skin=royal] .card.rlose.giveup,html[data-skin=royal] .card.rlose.quick{animation-delay:0s}
html[data-skin=royal] .rl-2l{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
html[data-skin=royal] .rl-2l small{font-size:13px;font-weight:900;margin-top:3px;-webkit-text-stroke:2.5px rgba(0,0,0,.35);opacity:.95}
@keyframes rlUp{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
html[data-skin=royal] .rl-ribbon{position:absolute;left:-22px;right:-22px;top:-34px}
@media (max-width:380px){ html[data-skin=royal] .rl-ribbon{left:-12px;right:-12px} }
html[data-skin=royal] .rl-ribbon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 3px rgba(40,0,10,.4))}
html[data-skin=royal] .rl-ribbon span{position:absolute;left:12%;right:12%;top:2.6%;height:70.5%;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:1000;color:#fff;
  -webkit-text-stroke:6px #6b2a08;paint-order:stroke fill;text-shadow:0 4px 0 #5a1f05;line-height:1;white-space:nowrap}
html[data-skin=royal] .rl-ribbon.fail span{-webkit-text-stroke-color:#2a3048;text-shadow:0 4px 0 #222838}
html[data-skin=royal] .rl-level{display:inline-block;margin:2px 0 14px;padding:3px 20px;border-radius:12px;background:#1a2470;border:2px solid #ffd35a;font-size:18px;font-weight:1000;color:#fff}
/* 18.11: карточка ривайва — одна мысль: «Only N left!» и сами фигуры крупно (без полосы, «что даст», подзаголовка и счётчика) */
html[data-skin=royal] .rl-left{font-size:27px;font-weight:1000;color:#fff;-webkit-text-stroke:5px #10195a;paint-order:stroke fill;line-height:1.15;margin:4px 0 6px}
html[data-skin=royal] .rl-left.rl-rug{font-size:18px;-webkit-text-stroke:4px #5a1020;color:#ffd9de;margin:2px 0 4px}
html[data-skin=royal] .rl-left b{color:#ffe14d;font-size:33px}
html[data-skin=royal] .rl-want{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 12px}
html[data-skin=royal] .rl-want canvas{width:66px;height:66px;filter:drop-shadow(0 0 9px rgba(255,226,120,.5))}
html[data-skin=royal] .rl-want.n1 canvas{width:80px;height:80px} html[data-skin=royal] .rl-want.n3 canvas{width:60px;height:60px}
html[data-skin=royal] .rl-want b{font-size:24px;font-weight:1000;color:#fff;-webkit-text-stroke:4px #10195a;paint-order:stroke fill;margin-left:4px}
html[data-skin=royal] .rl-line{font-size:18px;font-weight:900;color:#ffd7cf;-webkit-text-stroke:3.5px #10195a;paint-order:stroke fill;margin:6px 0 14px}
html[data-skin=royal] .rl-go{position:relative;width:100%;max-width:300px;min-height:72px;font-size:30px}
html[data-skin=royal] .rl-free{display:inline-block;margin-left:8px;padding:1px 8px 2px;border-radius:9px;background:#ffe14d;color:#7a4204;font-style:normal;font-size:16px;font-weight:1000;
  -webkit-text-stroke:0;text-shadow:none;vertical-align:3px;box-shadow:0 2px 0 #b07a10}
html[data-skin=royal] .rl-ad{display:inline-flex;width:26px;height:26px;margin-right:8px;border-radius:50%;background:#fff;color:#2a9a3c;align-items:center;justify-content:center;vertical-align:-3px;-webkit-text-stroke:0}
html[data-skin=royal] .rl-ad .adico{width:13px;height:13px;margin-left:2px}
html[data-skin=royal] .rl-low{margin-top:6px}
@media (max-height:680px){ html[data-skin=royal] .card.rlose{padding-top:32px} html[data-skin=royal] .rl-want{margin-bottom:8px} html[data-skin=royal] .rl-go{min-height:64px} }
@media (prefers-reduced-motion: reduce){ html[data-skin=royal] .card.rlose, html[data-skin=royal] .lz-hole, html[data-skin=royal] .lz-hole::after{animation:none} }
</style>

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Половинки». Поле w×h, в клетках — пусто, камень или плитка с половинкой фигуры.
// Свайп двигает плитку до упора (стена, камень, другая плитка). Если после остановки
// левая половинка стоит вплотную слева от правой того же цвета — стыковка: обе исчезают,
// целая фигура уходит в открытый заказ, которому она нужна. Фигура, которую никто не заказал, ложится
// в лоток (cap мест) и сама уйдёт в заказ, когда такой откроется; места в лотке нет — проигрыш.
// После хода без стыковки (CFG.DEAL = 'miss', с v0.8; 'each' — после каждого every-го хода) на поле падает новая половинка в клетку с искрой (видно заранее).
// Цель — закрыть все заказы очереди (и сломать ящики, если есть). Проигрыш — поле забито (пустых клеток нет и ходить некуда)
// или лишняя фигура не влезла в лоток. Если ходить нечем, а место на поле есть, раздача падает сама (topUp) — это не проигрыш.
// Коды клеток: 0 — пусто, -1 — камень, -2 — ящик, половинка — см. pieceCode ниже.
// Ход — число m = клетка*4 + направление (0 →, 1 ←, 2 ↓, 3 ↑).
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила, солвер, генератор ---
  PAR_BEAM: 40,        // ширина луча солвера в игре (par для звёзд); оффлайн-аудит берёт SIM_BEAM
  SIM_BEAM: 300,       // ширина луча солвера в sim.mjs
  MAX_DEPTH: 60,       // предел глубины солвера (ходов)
  BOT_CAP: 150,        // предел ходов ботов: на уровнях без раздачи иначе можно ходить вечно
  GEN_ATTEMPTS: 80,    // попыток собрать поле на один сид, прежде чем взять последнее
  TRAY_CAP: 4,         // мест в лотке: фигура, которую никто не заказал, ждёт здесь; не поместилась — проигрыш
  ORDER_SHOW: 2,       // сколько заказов открыто одновременно
  WANT: 0.5,           // доля раздач, цвет которых берётся из открытых заказов (остальные — любой цвет уровня)
  DEAL: 'miss',        // когда падает раздача: 'miss' — только после хода без стыковки (v0.8, решение Андрея); 'each' — после каждого хода; 'second' — через ход
  TRAY_PLUS: 0,        // добавка к лотку на всех уровнях (удалённый ключ tray_cap − TRAY_CAP; только ≥ 0 — только легче)
  WANT_BONUS: 0,       // сдвиг доли нужных раздач want на уровнях с раздачей (удалённый ключ want_bonus, −0,5…0,5)
  // --- сложность по уровням (17.11, Андрей: «вынесем сложность в ремоут конфиг»); применяет tuneSpec при создании уровня, удалённые ключи — в скобках ---
  ASSIST_UNTIL: 5,     // до какого уровня (номер игры) раздача «под пару» и догонялка (assist_until_level); с 6-го — обычная раздача
  ASSIST_PAIR: 0.3,    // вероятность укладки «под пару» на этих уровнях (assist_pair_chance, 0…1); 18.11: было 1 — «безбожно подыгрывают»
  CATCHUP_AFTER: 3,    // догонялка (принудительная половинка под заказ) — только если столько ходов подряд без стыковки и на поле нет ни одной стыковки (catchup_after_moves)
  END_GAP_P: 0.5,       // конец уровня (очередь заказов исчерпана): после раздачи нужного цвета с этой вероятностью следующая — «чужого» цвета, после неё нужный — точно (не видно, что игра подыгрывает)
  DOCK_DEAL: 0.55,     // раздача 'miss': после хода со стыковкой половинка падает с этой вероятностью (deal_after_dock_chance; 0 — как до 18.11)
  DOCK_WANT_K: 0.5,    // компенсация лишних раздач на уровнях 'miss': want + K·DOCK_DEAL (+0,275 при 0,55) — иначе поле забивается чужими цветами
  DOCK_HELP_K: 0.4,    // и help × (1 + K·DOCK_DEAL) (×1,22): больше «пар к одинокой». Обе уходят вместе с deal_after_dock_chance = 0
  DEAL_EACH_UNTIL: 9,  // до какого уровня раздача после каждого хода; дальше — DEAL (deal_each_until_level). 18.11 ночь: 8 → 9 — правило «после хода без стыковки» с 10-го (третий уровень верх/низ), не вместе с новой механикой
  // --- честная раздача (18.11, planFair; DESIGN «Честная раздача») ---
  FAIR: true,          // мешок цветов вместо прежнего правила (fair_deal; false — как до 18.11 ночи, с END_GAP_P)
  BAG_WANT_K: 2,       // «нужных» жетонов в мешке: цветов × want × K (bag_want_k, 0…2) — сколько раздач сверх «каждый цвет по разу» уходит на цвета открытых заказов
  RUN_MAX: 2,          // один цвет — не больше стольких раздач подряд (same_color_run_max, 1…5)
  WAIT_MAX: 5,         // нужный заказу цвет приходит не реже чем раз в столько раздач (wanted_wait_max, 2…20)

// Код плитки: 1 + цвет*4 + сторона (0 левая, 1 правая, 2 верхняя, 3 нижняя); +100 — в цепи; +1000*t — таймер на t ходов.
const pieceCode = (color, side, chain, timer) => 1 + color * 4 + side + (chain ? 100 : 0) + (timer ? 1000 * timer : 0);
const colorOf = (code) => ((code % 100) - 1) >> 2;
const sideOf = (code) => ((code % 100) - 1) & 3;
const isChained = (code) => code > 0 && Math.floor((code % 1000) / 100) === 1;
const timerOf = (code) => code > 0 ? Math.floor(code / 1000) : 0;
const isVert = (code) => sideOf(code) >= 2;

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Случайное число без состояния: раздача зависит только от (сид уровня, номер раздачи, соль).
function hashRand(seed, k, salt){
  return mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1) ^ Math.imul(salt + 7, 0x85EBCA77)) >>> 0)();
}

// Заказы новой волны (CFG.WAVE_ORDERS): размеры — как в очереди, цвета — сначала фигуры из лотка, потом цвета одиноких половинок на поле (их пары

/* DEV */ { const q = /[?&]juice2=([01])/.exec(location.search); if (q) J2 = SKIN !== 'classic' && q[1] === '1'; } /* КОНЕЦ DEV */

const Audio = {
  ac: null, noiseBuf: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended' && !G.paused) this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ac = null; return; }
    const len = Math.floor(this.ac.sampleRate * 0.5), buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0), rnd = mulberry32(99);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;

  },
  on(){ return this.ac && !G.save.muted && !G.paused; },
  suspend(){ try { if (this.ac && this.ac.state === 'running') this.ac.suspend(); } catch (e) {} },
  wake(){ try { if (this.ac && this.ac.state === 'suspended' && !G.paused) this.ac.resume(); } catch (e) {} },
  tone(freq, ms, type, delay, vol, toFreq){
    if (!this.on()) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, e);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(e + 0.02);
  },
  hiss(ms, f0, f1, delay, vol, type){
    if (!this.on() || !this.noiseBuf) return;
    const src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain(), t = this.ac.currentTime + (delay || 0), e = t + ms / 1000;
    src.buffer = this.noiseBuf; f.type = type || 'bandpass'; f.Q.value = 1.1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, e);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, e);
    src.connect(f).connect(g).connect(this.ac.destination); src.start(t); src.stop(e + 0.02);
  },
  swipe(ms){ this.hiss(Math.max(80, ms), 900, 2400, 0, 0.12); log('sound', 'swipe'); },
  thunk(delay, dist){ if (J2){ const f = 430 - Math.min(5, dist || 1) * 25; this.tone(f, 75, 'triangle', delay, 0.24, f * 0.6); this.hiss(30, 1700, 600, delay, 0.12); log('sound', 'thunk'); return; }   // v2: сухой «деревянный» ток 300–400 Гц (был глухой 130–190 Гц)
    const f = 200 - Math.min(5, dist || 1) * 14; this.tone(f, 100, 'sine', delay, 0.32, f * 0.5); this.hiss(50, 700, 250, delay, 0.1); log('sound', 'thunk'); },
  click(k, delay, combo){                            // «щёлк» стыковки: сухой клик + аккорд, выше с каждой фигурой и серией
    const f = NOTES[Math.min((J2 ? 2 : k) + Math.max(0, (combo || 1) - 1), NOTES.length - 1)];   // v2: высота — только от серии (одиночная — всегда одна нота, ×2, ×3… — вверх по пентатонике); раньше росла со счётом уровня и упиралась в потолок с 9-й фигуры
    if (J2) this.thock(delay);                      // v2: «тело» удара — низкий короткий толчок под звоном: половинки вдавились
    if (CANDY_SND){                                  // candy: «хрустально-сахарный» — короткий хруст сахара + стеклянный звон с негармоническими обертонами

      log('sound', 'click', 'k=' + k + ' combo=' + combo + ' candy'); return;
    }
    this.hiss(30, 5000, 3500, delay, 0.4, 'highpass');
    this.tone(f, 300, 'triangle', delay + 0.03, 0.22);
    this.tone(f * 1.5, 260, 'sine', delay + 0.06, 0.1);
    this.tone(f * 2, 200, 'sine', delay + 0.09, 0.07);
    if ((combo || 1) >= 2) this.hiss(260, 6000, 9000, delay + 0.08, 0.06, 'highpass');   // искристый хвост серии
    log('sound', 'click', 'k=' + k + ' combo=' + combo);
  },
  thock(delay){ this.tone(240, 70, 'sine', delay, 0.2, 120); this.hiss(35, 1800, 600, delay, 0.08, 'lowpass'); },   // v2: вдавливание при «щёлк» (без строки в журнале — пишет click)

  order(delay){ [784, 1047, 1319].forEach((f, i) => this.tone(f, 150, 'triangle', delay + i * 0.06, 0.14)); log('sound', 'order'); },
  tray(delay){ this.tone(330, 110, 'sine', delay, 0.16, 220); this.hiss(40, 900, 500, delay, 0.08); log('sound', 'tray'); },
  over(delay){ this.tone(160, 260, 'sawtooth', delay, 0.12, 90); this.tone(120, 300, 'square', delay + 0.05, 0.06, 70); log('sound', 'over'); },
  magnet(){ this.tone(260, 300, 'sine', 0, 0.14, 880); this.hiss(200, 1500, 5000, 0.05, 0.05, 'highpass'); log('sound', 'magnet'); },
  broom(){ this.hiss(380, 2600, 700, 0, 0.22); this.hiss(200, 5000, 2500, 0.1, 0.08, 'highpass'); log('sound', 'broom'); },
  revive(){ [392, 523, 659, 784].forEach((f, i) => this.tone(f, 160, 'triangle', i * 0.07, 0.14)); log('sound', 'revive'); },
  coin(delay, step){ const m = Math.pow(2, 4 * (step || 0) / 12);   // v2: step — сколько мест заказа уже заполнено до этой фишки: каждая следующая на большую терцию выше (заказ «набирается»)
    if (CANDY_SND){ this.tone(2637 * m, 180, 'sine', delay, 0.09); this.tone(2637 * 2.76 * m, 110, 'sine', delay + 0.005, 0.03); this.tone(3136 * m, 160, 'sine', delay + 0.05, 0.06); log('sound', 'slot'); return; }   // candy: леденец звякнул о леденец
    this.tone(1568 * m, 60, 'square', delay, 0.04); this.tone(2093 * m, 140, 'sine', delay + 0.04, 0.12); log('sound', 'slot'); },
  star(i, delay){ const f = NOTES[2 + i * 2]; this.tone(f, 320, 'triangle', delay, 0.2); this.tone(f * 2, 240, 'sine', delay + 0.02, 0.08); log('sound', 'star', 'i=' + i); },
  fanfare(delay){

  crack(delay){ this.hiss(140, 900, 300, delay, 0.35, 'lowpass'); this.tone(240, 90, 'square', delay, 0.06, 120); log('sound', 'crack'); },
  clink(delay){ this.tone(2400, 70, 'square', delay, 0.05); this.tone(3100, 120, 'triangle', delay + 0.05, 0.06); log('sound', 'clink'); },
  petrify(delay){ this.tone(120, 260, 'sawtooth', delay, 0.1, 60); this.hiss(260, 500, 150, delay, 0.2, 'lowpass'); log('sound', 'petrify'); },
  press(){ this.tone(660, 45, 'triangle', 0, 0.07, 520); },                                   // нажатие кнопки (без строки в журнале — их много)
  pop(){ this.tone(520, 90, 'sine', 0, 0.14, 1040); this.tone(1320, 80, 'triangle', 0.05, 0.06); log('sound', 'pop'); },
  tick(fin){ if (!this.on()) return; const t = performance.now(); if (!fin && t - (this.lastTick || 0) < 45) return; this.lastTick = t; this.tone(fin ? 1320 : 1760, fin ? 70 : 28, 'square', 0, fin ? 0.05 : 0.025); },   // тиканье набегающих цифр
  latch(delay){ delay = Math.max(0, delay || 0); this.tone(2600, 22, 'square', delay, 0.025); this.tone(1700, 40, 'triangle', delay + 0.03, 0.03); },   // захват: щелчок стопора — держит
  clack(delay){ delay = Math.max(0, delay || 0); this.tone(700, 45, 'square', delay, 0.035, 420); this.hiss(1200, 3000, 120, delay, 0.05, 'bandpass'); },   // захват разжался
  rocket(delay, vol){ delay = Math.max(0, delay || 0); vol = vol || 1; this.tone(900, 420, 'sine', delay, 0.035 * vol, 2600); this.hiss(1500, 5000, 420, delay, 0.05 * vol, 'highpass'); },   // royal-салют: свист взлёта

    if (D.rel){ D.rel = 0; D.t0 = now; D.t1 = now + ff; continue; }
    const u = Math.max(0, Math.min(0.95, (now - D.t0) / (D.t1 - D.t0)));

      Audio.order(delay(t)); nudgeAt(t); if (J2) buzzAt(t, CFG.J2_BUZZ_ORDER);   // royal: заказ закрыт — единственный мягкий толчок; v2 — и импульс
      tc += CFG.ORDER_DONE_MS / ts; const t2 = tc;
      vAt(t2, () => { const c = G.view.cards[e.slot]; if (!(c && c.id === e.id)) return;
        if (ROYAL){ const gg = geo(), L = ordersLayout(gg), r = L.cards[e.slot]; if (r) G.leaving.push({ card: c, x: easeX('c' + c.id, r.x, t2), y: r.y, w: r.w, h: r.h, f: L.f, t: t2 }); }   // royal: уезжает, а не исчезает
        G.view.cards[e.slot] = null; });
    } else if (e.type === 'order'){
      const t = tc, id = e.id;

        if (ROYAL){ const gg = geo(), L = ordersLayout(gg); if (L.next && V.oi === id) from = { x: easeX('n' + id, L.next.x, t), y: L.next.y, w: L.next.w, h: L.next.h, f: L.f }; }   // royal: растёт из карточки «следующий»
        V.cards[e.slot] = { id, c, f: c.map(() => false), pop: c.map(() => 0), born: t, done: 0, from }; V.oi = Math.max(V.oi, id + 1);
        if (ROYAL && s.queue[V.oi]){ const gg = geo(); G.ordX['n' + V.oi] = { from: gg.px + gg.pw - 30, to: null, t0: t }; V.nextT = t; }
        if (G2 && G.g2) Audio.g2new(R_ORD.grow / 1000 / ts * 0.9); });   // новый «следующий» въезжает справа

}

// --- волны (19.11 поздно; DESIGN «Длина уровней и волны») ---
// Переход волны на экране: в момент t — номер волны в панели (точка зажигается), выкрик «Wave 2!» / «Final wave!», звон, плитки подпрыгивают волной

function scheduleWave(e, t){

  e.honey.forEach((c, k) => { const tk = T1 + k * WAVE_FX.honey / ts, p = cellXY(c, g); if (k === 0) Audio.squelch(delay(tk)); burst(8, p.x + g.cell / 2, p.y + g.cell / 2, tk, { type: 'dot', colors: ['#f7b733', '#ffd25a', '#e8962a'], spread: 6.3, v: 0.12, life: 480, r: 3.6, g: 0.0008 }); });
  if (e.stones.length){ Audio.petrify(delay(T1)); for (const [, to] of e.stones){ const p = cellXY(to, g); burst(8, p.x + g.cell / 2, p.y + g.cell * 0.9, T1 + WAVE_FX.stone / ts, { type: 'dust', color: -1, angle: -Math.PI / 2, spread: 3, v: 0.1, life: 420, r: 4.5, g: 0 }); } }
  log('event', 'wave', 'wave=' + (e.wave + 1) + '/' + e.of + ' crates=' + e.crates.length + ' honey=' + e.honey.length + ' stones=' + e.stones.length + (e.color >= 0 ? ' new=' + SHAPES[e.color] : '') + ' moves=' + (G.s ? G.s.moves : 0) + ' sec=' + levelSecs().toFixed(1));

// Эффекты перехода волны применимы, пока на экране та же волна (отмена хода назад их снимает).

function drawSealed(c, x, y, w, h, now, f){

// --- бустеры и «Продолжить» ---
function useBoost(kind){
  if (!G.s || G.screen !== 'game' || G.paused || G.ending || isWin(G.s) || isLose(G.s)) return false;
  if (g2IntroTap()) return false;
  if (kind === 'undo' && !G.hist.length){ toast('Nothing to undo'); Audio.nope(); log('event', 'boost.none', kind); return false; }   // нечего отменять — не тратится и не продаётся
  if ((G.save.boost[kind] || 0) <= 0){ G.offer = kind; adOffer(kind); goto('offer'); return false; }
  if (kind === 'undo'){ G.save.boost.undo--; save(); log('event', 'boost.use', 'undo left=' + G.save.boost.undo); undo(); return true; }
  const n = kind === 'magnet' ? useMagnet(G.s) : ROYAL ? useTrayClear(G.s) : useBroom(G.s);   // royal (17.11): метла очищает лоток
  if (!n){ toast(kind === 'magnet' ? 'No pair for an open order' : ROYAL ? 'Tray is empty' : 'Nothing to sweep'); Audio.nope(); log('event', 'boost.none', kind); return false; }
  G.save.boost[kind]--; save();
  snapView(); clearFx(false);
  const T = clock(); G.lastInputT = T; G.hist = []; G.combo = 0; G.s = n;   // через бустер отмена не шагает
  if (ROYAL && kind === 'broom') G.view.tray = [];  // royal-метла: лоток пуст сразу, фигуры улетают анимацией (drawTraySweep)
  log('event', 'boost.use', kind + ' left=' + G.save.boost[kind]);
  let tEnd = T;
  if (kind === 'magnet'){ tEnd = animateMagnet(n.last, T, n.last.ev.filter(e => e.by === 'boost')); animateEvents(n.last, T, T + CFG.MAGNET_MS / G.timeScale); }
  else tEnd = ROYAL ? animateTrayClear(n.last, T) : animateBroom(n.last, T);
  if (n.last.extra.length) tEnd = Math.max(tEnd, animateSpawns(n.last, T, tEnd + 80 / G.timeScale, n.served));   // поле опустело — раздача упала сама
  hud();
  if (isWin(n)){ levelResult('win', n, 'by=' + kind); celebrate(Math.max(tEnd, G.merges.reduce((m, M) => Math.max(m, M.flyEnd), T))); }
  return true;
}
// Рекламное место в лотке: закрытая лунка с плюсом после последнего места. Тап — предложение ролика (заглушка), согласие — +1 место до конца уровня.
function adSlotOpen(s){ return !!s && s.every > 0 && !s.capBonus && s.li + 1 >= CFG.BOOST_FROM; }
function trayPlaces(s){ return s.cap + (adSlotOpen(s) ? 1 : 0); }          // сколько лунок рисовать: места лотка и, если есть, рекламная
function offerTraySlot(){
  if (!G.s || G.screen !== 'game' || G.ending || !adSlotOpen(G.s) || isWin(G.s) || isLose(G.s)) return false;
  G.offer = 'slot'; adOffer('tray space', 'tray=' + G.s.tray.length + '/' + G.s.cap); goto('offer'); return true;
}
function openTraySlot(){
  const n = G.s && addTraySlot(G.s); if (!n) return false;
  snapView(); clearFx(false); G.hist = []; G.s = n; snapView();          // через бустер отмена не шагает
  const T = clock(), p = trayXY(n.cap - 1, geo()); G.lastInputT = T;
  burst(14, p.x, p.y, T, { type: 'star', color: 2, v: 0.16, life: 520, r: 6, g: 0 });

// Магнит: две половинки летят друг к другу и стыкуются посередине. L = { a, b, aCode, bCode, color, target }.
function animateMagnet(L, T, evs){
  const t0 = T + CFG.MAGNET_MS / G.timeScale;
  Audio.magnet(); buzz([8, 40, 16]);
  const chain = (evs || []).filter(e => e.type === 'done' || e.type === 'order' || e.type === 'untray' || e.type === 'wave');
  return addMerge({ active: L.a, partner: L.b, code: L.aCode, partnerCode: L.bCode, color: L.color, target: L.target, tShow: T, t0, combo: 1, kind: 'magnet', evs: chain });
}
// Метла: полоса идёт по ряду или столбцу, половинки исчезают по мере прохода. L = { row, col, gone: [{ cell, code }] }.
// Royal-метла: по лотку слева направо проходит золотая полоса, фигуры по очереди вылетают вправо-вверх с пылью и искрами.

  L.gone.forEach((color, k) => { const p = trayXY(k, g), at = T + ms * (p.x - r.x) / r.w;
    burst(8, p.x, p.y, at, { type: 'dust', color: -1, v: 0.12, life: 460, r: 5, g: 0 });
    burst(6, p.x, p.y, at, { type: 'rect', colors: [color, -2], v: 0.2, vy: -0.12, life: 600, r: 3.5, g: 0.0005 }); });

  fxOpen('trayclear', t1 + 300, 'items=' + L.gone.length);

function drawTraySweep(c, g, now){
  const S = G.traySweep; if (!S) return;
  if (now >= S.t1 + 400){ G.traySweep = null; return; }
  const r = trayRect(g), ms = S.t1 - S.t0, u = Math.max(0, Math.min(1, (now - S.t0) / ms));
  for (const it of S.items){                       // фигура: стоит, пока полоса не дошла, потом улетает вправо-вверх, кружась и тая
    const p = trayXY(it.k, g), at = S.t0 + ms * (p.x - r.x) / r.w, v = Math.max(0, (now - at) / 380);

    c.save(); rr(c, r.x, r.y, r.w, r.h, r.h / 2); c.clip(); c.fillStyle = gr; c.fillRect(x - 40, r.y, 46, r.h); c.restore(); }   // золотая полоса метлы

function animateBroom(L, T){

// --- Ривайв и луз (17.11, DESIGN «Ривайв и луз»). «Continue» — до RC.revives_per_level раз за уровень; первый бесплатный при RC.free_revive,
// следующие — за ролик. Журнал: monet.offer / accept / decline с меткой revive_free (бесплатный) или rv_revive (за ролик).
function reviveOpen(s){ return !!s && !s.dead && isLose(s) && s.every > 0 && (G.revives || 0) < RC.revives_per_level; }

function reviveInfo(s){ const p = goalProgress(s); return 'level=' + (s.li + 1) + ' n=' + ((G.revives || 0) + 1) + '/' + RC.revives_per_level + ' left=' + (p.total - p.done) + ' why=' + loseWhy(s); }
function reviveOffer(s){                                    // одно предложение на проигрыш: возврат с «Give up?» не пишет второе
  const key = s.li + ':' + s.moves + ':' + (G.revives || 0); if (G.offerKey === key) return; G.offerKey = key;

// Фигуры, которых ещё ждут заказы: открытые (незакрытые места) и очередь — цвета по порядку.
function goalLeftColors(s){

// Пятно на причине: прямоугольник лотка (с лункой под лишнюю фигуру) или поля в координатах оверлея.

function loseHole(ov, why){

// Проигрыш royal (18.11): причина — в игре под пятном и лентой; в карточке одна мысль «почти у цели» и одна главная кнопка.
function royalLose(ov, card){

// «Продолжить» после проигрыша: лоток пустеет, магнит собирает пары под заказ, метла сметает ряд. Заглушка рекламы — без ролика.
function doRevive(){
  const n = G.s && revive(G.s); if (!n) return false;
  G.revived = true; G.revives = (G.revives || 0) + 1; G.hist = []; G.ending = 0; G.overColor = null;
  snapView(); clearFx(true);
  const T = clock(), ts = G.timeScale, g = geo(), L = n.last; G.lastInputT = T;
  G.view.tray.forEach((it, k) => { const p = trayXY(k, g); burst(8, p.x, p.y, T, { type: 'dot', colors: [it.color, -2], v: 0.14, life: 420, r: 3 }); });
  G.view.tray = [];
  G.s = n; goto('game');
  log('event', 'revive', 'pairs=' + L.pairs.length + ' swept=' + L.gone.length + ' tray=' + L.cleared.length);
  let t = T + 120 / ts;
  for (const q of L.pairs){ addMerge({ active: q.a, partner: q.b, code: q.aCode, partnerCode: q.bCode, color: q.color, target: q.target, tShow: t, t0: t + CFG.MAGNET_MS / ts, combo: 1, kind: 'magnet', evs: [] }); t += CFG.MAGNET_MS * 0.9 / ts; }
  const tPairs = G.merges.reduce((m, M) => Math.max(m, M.flyEnd), t);
  if (L.gone.length){ const t0 = L.pairs.length ? t + 80 / ts : t; for (const q of L.gone) G.ghosts.push({ cell: q.cell, kind: 'piece', code: q.code, until: t0 }); vAt(t0, () => animateBroom(L, t0)); G.fxUntil = Math.max(G.fxUntil, t0 + CFG.BROOM_MS / ts); }
  if (L.extra.length) for (const S of L.extra) G.drops.push({ code: S.code, cell: S.cell, t0: tPairs, t1: tPairs + CFG.SPAWN_MS / ts });
  vAt(tPairs + 30, () => { G.view = viewFromState(n); });           // пары могли закрыть заказы — к концу вид совпадает с ядром
  { const we = L.ev.find(e => e.type === 'wave'); if (we){ G.view.wave = we.wave - 1; scheduleWave(we, tPairs + 40); } }   // пары «Продолжить» закрыли волну — тот же переход
  praise('Second chance!', W / 2, g.oy + g.bh * 0.42, T, P.accent, 34);
  Audio.revive(); buzz([20, 40, 20]);
  fxOpen('revive', tPairs + 30, 'pairs=' + L.pairs.length);

}
// События хода: ящик ломается и летит в цель, цепь рассыпается, таймер каменеет. До момента события клетка показывает прежнее.
function animateEvents(L, T, t1){
  const g = geo(), cs = g.cell, ts = G.timeScale;

  const tp = (firstMerge === Infinity ? t1 : firstMerge) + CFG.DOCK_MS * 0.45 / ts;
  ldEvents(L, T, t1, tp);                            // ЛД (19.11): ковёр раскатывается, ворота открываются, сундук выплёвывает половинку
  for (const e of L.ev){
    if (e.cell === undefined || e.type === 'chest' || e.type === 'chestGone') continue;   // события заказов и лотка раскладывает scheduleDelivery

      burst(8, cx, cy, tp, { type: 'dust', color: -1, v: 0.08, life: 420, r: 5, g: 0 });

      Audio.crack((tp - clock()) / 1000);
    } else if (e.type === 'chain'){
      G.ghosts.push({ cell: e.cell, kind: 'chain', until: tp });

// Отмена последнего хода (бустер Undo списывает запас в useBoost). Через бустер и «Continue» не шагает: там стек сбрасывается.

const cv = $('cv'), ctx = cv.getContext('2d');
const VW = 400;                                    // виртуальная ширина; логика и раскладка в виртуальных юнитах (§2)
let scale = 1, W = VW, H = 600, DPR = 1;
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// Раскладка сверху вниз (v0.9): ПАНЕЛЬ ЦЕЛИ — ряд заказов (плотная группа по центру, ящики — такой же карточкой) и под ним в той же панели лоток;
// заметный зазор; ПОЛЕ — своя подложка другого тона. Так зона «что собрать и куда ляжет лишнее» не слипается с полем.
// 18.11 v3 (G2, Андрей: «лотки с заказами можно немного увеличить, расширив по вертикали панель»): BIGP — карточки 68 (было 56), фишки r 24 (20),
// карман очереди 46 (40), лоток 46 с лунками 35 (40 и 30); панель 142 (124). Чтобы поле не сжималось на низком экране, зазор панель–поле 22 (30).
const BIGP = G2 && CFG.G2_BIG_PANEL;
const ORD_H = BIGP ? 68 : 56, ORD_GAP = 8, CHIP_R = BIGP ? 24 : 20, CHIP_STEP = BIGP ? 56 : 47, CARD_PAD = BIGP ? 18 : 16;   // карточка заказа облегает свои фишки: высота, зазор, радиус и шаг фишек, поля
const NEXT_H = 36, NEXT_STEP = 18, NEXT_PAD = 14;                    // маленькая карточка «следующий заказ»: высота, шаг фигур, поля
// royal (18.11, Андрей: «очередь немного сливается с фоном»): очередь — холодный карман в цвет поля с золотой кромкой, фигуры на белых монетках, «+N» — золотая монетка

const CRATE_CARD_W = BIGP ? 106 : 92;                                              // карточка-цель «ящики»: фишка-ящик и счётчик «0/3»
const RT = SKIN !== 'classic';                                          // royal (17.11, мокап лотка D): компактный карамельный паз в золоте, корзинка слева, без счётчика
const BAND_PAD = 10, TRAY_GAP = 8, TRAY_H = BIGP ? 46 : RT ? 40 : 42, TRAY_S = BIGP ? 35 : 30, TRAY_STEP = BIGP ? 42 : RT ? 36 : 37, TRAY_PAD = BIGP ? 7 : RT ? 6 : 8, TRAY_CNT = RT ? 0 : 46, TRAY_ICON = 0;   // 17.11: корзинку убрали (Андрей)   // лоток в панели цели: отступ от карточек, высота, место, шаг, поля, место под счётчик «2/4»
const PANEL_H = BAND_PAD + ORD_H + TRAY_GAP + TRAY_H + BAND_PAD;     // панель цели целиком
const TOP_GAP = BIGP ? 22 : 30, BOTTOM_PAD = 18;                                  // зазор между панелью цели и полем (разнесены); поле под рамкой
function geo(){
  const s = G.s, avail = H - 8, head = PANEL_H + TOP_GAP;

function cellXY(i, g){ const x = i % G.s.w; return { x: g.ox + x * g.cell, y: g.oy + (i - x) / G.s.w * g.cell }; }
function cellAt(p){
  if (!G.s) return -1;
  const g = geo(), x = Math.floor((p.x - g.ox) / g.cell), y = Math.floor((p.y - g.oy) / g.cell);

cv.addEventListener('pointerdown', (e) => {

  if (g2IntroTap()){ G.lastInputT = clock(); return; }   // G2: интро заказов — касание пропускает его, полю не отдаётся
  if (adSlotOpen(G.s)){ const v = toVirtual(e), q = trayXY(G.s.cap, geo()); if (Math.hypot(v.x - q.x, v.y - q.y) <= q.r + 9){ log('input', 'tap', 'ad-slot'); offerTraySlot(); return; } }
  const i = cellAt(toVirtual(e));
  if (i < 0 || G.s.grid[i] <= 0) return;
  G.drag = { cell: i, sx: e.clientX, sy: e.clientY, id: e.pointerId, dir: -1, len: 0, t0: clock() }; G.kbd = false; G.lastInputT = clock();
  if (J2 && G.s.grid[i] > 0){ Audio.grab(); if (CFG.J2_BUZZ_GRAB) buzz(CFG.J2_BUZZ_GRAB); }   // v2: «взял в руку» — тихий ток и лёгкий импульс сразу на касании

cv.addEventListener('pointermove', (e) => {
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  const dx = e.clientX - D.sx, dy = e.clientY - D.sy;
  D.len = Math.hypot(dx, dy);
  D.dir = Math.hypot(dx, dy) < CFG.SWIPE_PX ? -1 : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 1) : (dy > 0 ? 2 : 3);
});
function onUp(e){
  const D = G.drag; if (!D || e.pointerId !== D.id) return;
  G.drag = null;
  if (D.dir < 0){ bump(D.cell, -1); return; }      // тап — плитка вздрагивает, хода нет

cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
function fit(){
  const r = $('game').getBoundingClientRect(); if (!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  scale = r.width / VW; W = VW; H = r.height / scale;
  const cw = Math.round(r.width * DPR), ch = Math.round(r.height * DPR);
  if (cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(() => { fit(); if (ROYAL && G.s && (G.screen === 'lose' || G.screen === 'giveup')) loseHole($('overlay'), loseWhy(G.s) || 'board'); }, 140); };   // пятно проигрыша едет за полем
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
function setPaused(reason, on){
  const was = PAUSE.why.size > 0; if (on) PAUSE.why.add(reason); else PAUSE.why.delete(reason);
  const is = PAUSE.why.size > 0; if (was === is) return;
  G.paused = is;
  if (is){ PAUSE.at = performance.now(); G.drag = null; Audio.suspend(); log('event', 'pause', 'reason=' + reason); }
  else { PAUSE.total += performance.now() - PAUSE.at; PAUSE.at = 0; Audio.wake(); log('event', 'resume', 'reason=' + reason); }
}

window.addEventListener('pageshow', () => setPaused('hidden', document.hidden));

// Контур фигуры цвета col с центром (cx, cy) и «радиусом» R. Все фигуры симметричны относительно вертикали —
// поэтому половинки режутся по вертикальной оси и стыкуются ровным краем.
function shapePath(c, col, cx, cy, R){
  c.beginPath();
  if (SHAPES[col] === 'heart'){
    c.moveTo(cx, cy + R * 0.9);
    c.bezierCurveTo(cx - R * 1.3, cy + R * 0.05, cx - R * 0.8, cy - R * 1.05, cx, cy - R * 0.42);
    c.bezierCurveTo(cx + R * 0.8, cy - R * 1.05, cx + R * 1.3, cy + R * 0.05, cx, cy + R * 0.9);
  } else if (SHAPES[col] === 'circle' || SHAPES[col] === 'rainbow'){
    c.arc(cx, cy, R * 0.86, 0, Math.PI * 2);
  } else if (SHAPES[col] === 'star'){
    for (let k = 0; k < 10; k++){
      const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? R * 0.44 : R * 1.0;
      c.lineTo(cx + Math.cos(a) * rr2, cy + 0.08 * R + Math.sin(a) * rr2);
    }
  } else if (SHAPES[col] === 'diamond'){
    c.moveTo(cx, cy - R); c.lineTo(cx + R * 0.78, cy); c.lineTo(cx, cy + R); c.lineTo(cx - R * 0.78, cy);
  } else {                                           // капля: острый верх, круглый низ
    c.moveTo(cx, cy - R);
    c.bezierCurveTo(cx + R * 0.95, cy - R * 0.05, cx + R * 0.85, cy + R * 0.9, cx, cy + R * 0.9);
    c.bezierCurveTo(cx - R * 0.85, cy + R * 0.9, cx - R * 0.95, cy - R * 0.05, cx, cy - R);
  }
  c.closePath();
}

        if (M.vert) rr(ctx, a.x + cs * 0.06, a.y + cs * 0.06 + tv * cs * 0.3, cs * 0.88, cs * 1.88 - tv * cs * 0.6, cs * 0.2);
        else rr(ctx, a.x + cs * 0.06 + tv * cs * 0.3, a.y + cs * 0.06, cs * 1.88 - tv * cs * 0.6, cs * 0.88, cs * 0.2);
        ctx.fill(); ctx.globalAlpha = 1;
        // стоявшая (не пришедшая) половинка смещена к пришедшей на ov — они вдавлены; пришедшая рисуется поверх
        const oa = act ? 0 : ov, ob = act ? -ov : 0;   // a — левая/верхняя: её край смещается вправо/вниз (+), b — влево/вверх (−)
        const drawA = () => M.vert ? drawHalf(ctx, M.aCode, J.x, J.y + oa, R, a.x, a.y, cs, cs * 2) : drawHalf(ctx, M.aCode, J.x + oa, J.y, R, a.x, a.y, cs * 2, cs);
        const drawB = () => M.vert ? drawHalf(ctx, M.bCode, J.x, J.y + ob, R, a.x, a.y, cs, cs * 2) : drawHalf(ctx, M.bCode, J.x + ob, J.y, R, a.x, a.y, cs * 2, cs);
        if (act){ drawB(); drawA(); } else { drawA(); drawB(); }
        const sa = Math.max(0, Math.min(1, (el - (hold - seam)) / seam));                // шов тает: целое проявляется поверх половинок
        if (sa > 0){ ctx.globalAlpha = sa; drawShape(ctx, M.color, edgeX, cy, R); ctx.globalAlpha = 1; }
        ctx.restore();
      } else {
        const tb = (el - hold) * ts2, sqB = REDUCED ? 0 : CFG.J2_SQUASH * Math.exp(-tb / 45) * Math.cos(tb / 22), pop = REDUCED ? 1 : 1 + CFG.DOCK_SPRING * 0.45 * Math.sin(Math.PI * Math.min(1, tb / 130)) * (1 + 0.1 * (pw - 1));
        ctx.save(); ctx.translate(edgeX, cy); if (M.vert) ctx.scale(pop * (1 + sqB), pop * (1 - sqB)); else ctx.scale(pop * (1 - sqB), pop * (1 + sqB));
        drawShape(ctx, M.color, 0, 0, R);
        if (CANDY){ const v = tb / ((CFG.J2_DOCK_MS - CFG.J2_HOLD_MS) || 1);   // candy: леденец вспыхивает «светом» и по нему пробегает блик — как раньше, но сразу после замка
          if (v < 0.35){ ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - v / 0.35) * (0.45 + 0.05 * pw); drawShape(ctx, M.color, 0, 0, R); ctx.restore(); }
          candyGlint(ctx, M.color, 0, 0, R, (v - 0.05) / 0.7, 0.55 * (1 - Math.max(0, v - 0.6) * 2.5)); }
        ctx.restore();
      }
    } else if (u < 0.45 && !M.magnet && ROYAL){                // royal: половинки сходятся с перелётом и «чмоком» (squash & stretch вокруг стыка)
      const v = backOut(u / 0.45), gap = cs * 0.06 * (1 - v), sq = REDUCED ? 0 : CFG.DOCK_SQUASH * Math.max(0, Math.sin(Math.max(0, (u / 0.45 - 0.55) / 0.45) * Math.PI));
      ctx.save(); ctx.translate(J.x, J.y); if (M.vert) ctx.scale(1 + sq, 1 - sq); else ctx.scale(1 - sq, 1 + sq); ctx.translate(-J.x, -J.y);
      ctx.globalAlpha = 1 - v * 0.7; ctx.fillStyle = P.tile;
      if (M.vert) rr(ctx, a.x + cs * 0.06, a.y + cs * 0.06 + v * cs * 0.3, cs * 0.88, cs * 1.88 - v * cs * 0.6, cs * 0.2);
      else rr(ctx, a.x + cs * 0.06 + v * cs * 0.3, a.y + cs * 0.06, cs * 1.88 - v * cs * 0.6, cs * 0.88, cs * 0.2);
      ctx.fill(); ctx.globalAlpha = 1;
      if (M.vert){ drawHalf(ctx, M.aCode, J.x, J.y - gap, R, a.x, a.y, cs, cs * 2); drawHalf(ctx, M.bCode, J.x, J.y + gap, R, a.x, a.y, cs, cs * 2); }
      else { drawHalf(ctx, M.aCode, J.x - gap, J.y, R, a.x, a.y, cs * 2, cs); drawHalf(ctx, M.bCode, J.x + gap, J.y, R, a.x, a.y, cs * 2, cs); }
      ctx.restore();
    } else if (u < 1 && ROYAL){                        // royal: вспышка и кольцо-волна в точке стыка, целое пружинит (затухающее колебание); серия — ярче, без тряски
      const v = M.magnet ? u : (u - 0.45) / 0.55, pw = Math.min(4, M.combo), t = v * (M.t1 - M.t0) * 0.55;
      const spring = REDUCED ? 1 : 1 + CFG.DOCK_SPRING * (1 + 0.1 * (pw - 1)) * Math.exp(-t / 90) * Math.sin(t / 34 + 0.6);
      const rr2 = (now - (M.t0 + (M.t1 - M.t0) * 0.45)) / (CFG.RING_MS / G.timeScale);
      if (rr2 >= 0 && rr2 < 1){ ctx.save(); ctx.globalAlpha = (1 - rr2) * (0.7 + 0.08 * pw); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = (5 + pw) * (1 - rr2) + 1;
        ctx.beginPath(); ctx.arc(edgeX, cy, R * (0.7 + 1.5 * easeIO(rr2)), 0, Math.PI * 2); ctx.stroke();
        if (pw >= 2){ ctx.globalAlpha *= 0.6; ctx.strokeStyle = P.colors[M.color] || '#fff'; ctx.lineWidth *= 0.6; ctx.beginPath(); ctx.arc(edgeX, cy, R * (0.5 + 2.1 * easeIO(rr2)), 0, Math.PI * 2); ctx.stroke(); }
        ctx.restore(); }
      if (v < 0.35){ ctx.save(); const fa = (1 - v / 0.35) * (0.55 + 0.1 * pw), fg = ctx.createRadialGradient(edgeX, cy, 0, edgeX, cy, R * 1.4); fg.addColorStop(0, 'rgba(255,255,255,' + fa.toFixed(3) + ')'); fg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(edgeX, cy, R * 1.4, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }   // вспышка
      drawBurst(ctx, edgeX, cy, R, M.color, v, pw);
      ctx.save(); ctx.translate(edgeX, cy); drawShape(ctx, M.color, 0, 0, R * spring);
      if (CANDY){                                     // candy: леденец вспыхивает (тот же спрайт поверх «светом») и по нему пробегает блик
        if (v < 0.3){ ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - v / 0.3) * (0.5 + 0.05 * pw); drawShape(ctx, M.color, 0, 0, R * spring); ctx.restore(); }
        candyGlint(ctx, M.color, 0, 0, R * spring, (v - 0.12) / 0.6, 0.55 * (1 - Math.max(0, v - 0.5) * 2));
      }
      ctx.restore();
    } else if (u < 0.45 && !M.magnet){
      const v = backOut(u / 0.45), gap = cs * 0.06 * (1 - v);
      ctx.save(); ctx.globalAlpha = 1 - v * 0.7; ctx.fillStyle = P.tile;
      if (M.vert) rr(ctx, a.x + cs * 0.06, a.y + cs * 0.06 + v * cs * 0.3, cs * 0.88, cs * 1.88 - v * cs * 0.6, cs * 0.2);
      else rr(ctx, a.x + cs * 0.06 + v * cs * 0.3, a.y + cs * 0.06, cs * 1.88 - v * cs * 0.6, cs * 0.88, cs * 0.2);
      ctx.fill(); ctx.restore();
      if (M.vert){ drawHalf(ctx, M.aCode, J.x, J.y - gap, R, a.x, a.y, cs, cs * 2); drawHalf(ctx, M.bCode, J.x, J.y + gap, R, a.x, a.y, cs, cs * 2); }
      else { drawHalf(ctx, M.aCode, J.x - gap, J.y, R, a.x, a.y, cs * 2, cs); drawHalf(ctx, M.bCode, J.x + gap, J.y, R, a.x, a.y, cs * 2, cs); }
    } else if (u < 1){
      const v = M.magnet ? u : (u - 0.45) / 0.55, pulse = 1 + (0.35 + 0.05 * Math.min(4, M.combo)) * Math.sin(Math.min(1, v * 1.6) * Math.PI);
      drawBurst(ctx, edgeX, cy, R, M.color, v, Math.min(4, M.combo));
      ctx.save(); ctx.translate(edgeX, cy); ctx.rotate(Math.sin(v * Math.PI * 2) * 0.12 * (1 - v)); drawShape(ctx, M.color, 0, 0, R * pulse); ctx.restore();
    } else if (M.g2f){ drawG2Flight(ctx, g, M, now, edgeX, cy, R);
    } else {
      const FE = J2 ? (q) => { q = q < 0 ? 0 : q > 1 ? 1 : q; return 1 - Math.pow(1 - q, 2.2); } : easeIO;   // v2: быстрый взлёт и мягкий подлёт (раньше — медленный старт: фигура «висела» у поля)
      const v = FE((now - M.t1) / (M.flyEnd - M.t1)), sp = targetXY(M.target, g);
      if (M.target.kind === 'bonus'){ ctx.save(); ctx.globalAlpha = 1 - v; drawShape(ctx, M.color, edgeX, cy - v * 40, R * (1 - v * 0.6)); ctx.restore(); continue; }
      const arc = J2 ? Math.max(24, Math.min(60, Math.hypot(sp.x - edgeX, sp.y - cy) * CFG.J2_FLY_ARC)) : 60, grow = J2 && !REDUCED ? CFG.J2_FLY_GROW : 0;
      const x = edgeX + (sp.x - edgeX) * v, y = cy + (sp.y - cy) * v - Math.sin(v * Math.PI) * arc;
      ctx.save(); ctx.globalAlpha = J2 ? 0.26 : 0.3; for (let k = 1; k <= (J2 ? 2 : 3); k++){ const vk = FE((now - M.t1 - k * (J2 ? 20 : 30)) / (M.flyEnd - M.t1)); if (vk <= 0) continue;   // v2: при быстром взлёте копии разлетались — две и ближе
        drawShape(ctx, M.color, edgeX + (sp.x - edgeX) * vk, cy + (sp.y - cy) * vk - Math.sin(vk * Math.PI) * arc, (R + (sp.r - R) * vk) * (1 - k * 0.15) * (1 + grow * Math.sin(vk * Math.PI))); }
      ctx.restore();
      if (CANDY){ const rr3 = (R + (sp.r - R) * v) * (1 + grow * Math.sin(v * Math.PI)); ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(v * Math.PI) * 0.45); drawShape(ctx, M.color, 0, 0, rr3);   // candy: без кувырка — леденец летит с отражением: блик дважды пробегает
        candyGlint(ctx, M.color, 0, 0, rr3, (v * 2) % 1, 0.5); ctx.restore(); }
      else { ctx.save(); ctx.translate(x, y); ctx.rotate(v * Math.PI * 2); drawShape(ctx, M.color, 0, 0, (R + (sp.r - R) * v) * (1 + grow * Math.sin(v * Math.PI))); ctx.restore(); }
    }
  }
  for (const f of G.crateFly){                                  // ящик летит в фишку цели
    if (now < f.t0 || now >= f.t1) continue;
    const v = easeIO((now - f.t0) / (f.t1 - f.t0)), sp = crateChipXY(g);
    const x = f.x + (sp.x - f.x) * v, y = f.y + (sp.y - f.y) * v - Math.sin(v * Math.PI) * 50, sz = cs * (0.9 - 0.55 * v);
    ctx.save(); ctx.translate(x, y); ctx.rotate(v * 5); drawCrate(ctx, -sz / 2, -sz / 2, sz); ctx.restore();
  }
  // фигуры из лотка летят в открывшийся заказ
  if (G.flies.length){
    G.flies = G.flies.filter(f => now < f.t1);
    for (const f of G.flies){
      const v = easeIO((now - f.t0) / (f.t1 - f.t0)), a = trayXY(f.from, g), b = targetXY(f.T, g);
      drawChip(ctx, f.color, a.x + (b.x - a.x) * v + Math.sin(v * Math.PI) * 14, a.y + (b.y - a.y) * v, a.r + (b.r - a.r) * v, 1 + 0.25 * Math.sin(v * Math.PI));
    }
  }
  // метла: полоса идёт по ряду или столбцу
  if (G.sweep && now >= G.sweep.t0 && now < G.sweep.t1){
    const S = G.sweep, u = (now - S.t0) / (S.t1 - S.t0);
    ctx.save(); ctx.globalAlpha = 0.85 * Math.sin(Math.min(1, u * 1.2) * Math.PI * 0.9 + 0.3); ctx.fillStyle = P.honey;
    if (S.row >= 0) rr(ctx, g.ox + g.bw * u - 7, g.oy + S.row * cs + 4, 14, cs - 8, 7); else rr(ctx, g.ox + S.col * cs + 4, g.oy + g.bh * u - 7, cs - 8, 14, 7);
    ctx.fill(); ctx.restore();
  }
  if (g2 && ghost) drawG2Aim(ctx, g, now, ghost);
  drawParticles(ctx, now);
  drawPraise(ctx, now);
  // рука на уроках: показывает следующий ход (до первого хода — сразу, дальше после короткой паузы). Текста на уровнях нет.
  if (lesson && !(TUT_ON && (TUT.cur || TUT.q.length)) && G.screen === 'game' && !G.drag && !isWin(s) && !isLose(s) && now >= G.fxUntil && now - G.lastInputT > (s.moves ? CFG.LESSON_HINT_MS : 500)){
    if (G.handFor !== s){ G.handFor = s; G.handMove = lessonMove(s); G.handT0 = now; if (G.handMove >= 0) log('fx.start', 'hand', 'cell=' + (G.handMove >> 2) + ' dir=' + '→←↓↑'[G.handMove & 3]); }
    if (G.handMove >= 0){
      const a = cellXY(G.handMove >> 2, g), b = cellXY(peekMove(s, G.handMove).to, g);
      drawHand(ctx, a.x + cs * 0.5, a.y + cs * 0.55, b.x - a.x, b.y - a.y, now - G.handT0);
    }
  }
  if (hintHand){                                   // G2 v3: подсказка при бездействии — палец встаёт на плитку и тянет её до места остановки, с повтором (тот же ход ядра, что и у обводки)
    const a = cellXY(hintCell, g), b = cellXY(peekMove(s, G.hintMove).to, g);
    drawHand(ctx, a.x + cs * 0.5, a.y + cs * 0.55, b.x - a.x, b.y - a.y, now - G.hintHandT0);
  }
  if (g2){ const IN = g2IntroState(now); if (IN){ drawG2IntroDim(ctx, g, IN); drawOrders(ctx, g, now, null, true); } }   // G2: интро заказов — поверх приглушённого поля
  // журнал fx.end и финал — по состоянию в кадре, не по событию (урок «Стыковки»)
  if (G.fxOpen.length){ const keep = []; for (const f of G.fxOpen){ if (now >= f.t1) log('fx.end', f.name); else keep.push(f); } G.fxOpen = keep; }
  if (G.screen === 'game' && !G.ending && (isWin(s) || isLose(s)) && now >= G.fxUntil) G.ending = now + (isWin(s) ? 0 : CFG.END_DELAY_MS);
  if (G.ending && now >= G.ending) finishEnding();
  if (toastUntil && now > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
  /* DEV */
  devClock(s);
  /* КОНЕЦ DEV */
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4). Кадр под try/catch. ---
let lastFrame = 0, frameErrors = 0;
function safeRender(){ try { render(); } catch (e) { frameErrors++; if (frameErrors < 5) console.error(e); log('event', 'frame.error', e && e.message); } }
function frame(){ lastFrame = performance.now();
  if (G.queued != null && !G.paused && G.screen === 'game' && !G.drops.some(D => clock() < D.t1)){ const m = G.queued; G.queued = null; doMove(m); }   // отложенный ход — сразу, как кусок встал
  if (TUT_ON){ try { tutTick(); drawSpot(); } catch (e) { log('event', 'frame.error', 'tut ' + (e && e.message)); } } if (!G.paused){ if (!(ROYAL && (G.screen === 'fireworks' || G.screen === 'win'))) safeRender(); try { drawFx(); } catch (e) {} if (ROYAL) try { drawSky(); } catch (e) { log('event', 'frame.error', 'sky ' + (e && e.message)); } } requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, ходы, прогон времени, автоигра. Только DEV: в сборке для стора вырезан. ---
/* DEV */
const DIR_KEYS = { R: 0, L: 1, D: 2, U: 3, '→': 0, '←': 1, '↓': 2, '↑': 3 };
window.POLOVINKI = {
  G, CFG,
  state(){ const s = G.s; return s ? { level: s.li + 1, hard: s.hard, rows: gridRows(s), moves: s.moves, docks: s.docks,
    orders: s.active.map(o => o && o.c.map((c, k) => (o.f[k] ? '+' : '') + LAYOUT_CHARS[c]).join(' ')), queueLeft: s.queue.length - s.oi,
    tray: s.tray.map(c => LAYOUT_CHARS[c]).join(''), cap: s.cap, crates: s.crates, crateGoal: s.crateGoal, progress: goalProgress(s), every: s.every,
    plan: CFG.LEVEL_PLAN, label: planLabel(LEVELS[s.li]), rug: s.rugGoal ? s.rugN + '/' + s.rugGoal : '', gates: s.gates ? s.gates.map(q => (q.open ? 'open' : q.ord ? 'ord ' + q.ord.map(c => LAYOUT_CHARS[c]).join('') + (q.done ? ' done' : '') : 'need ' + q.need) + ':' + q.cells.length).join(',') : '',
    chests: s.chests ? s.chests.map(q => q.cell + ':' + q.left).join(',') : '', doneOrders: s.doneOrders,
    deal: s.deal, next: s.next, par: G.par, undo: G.hist.length, boost: { ...G.save.boost }, revived: G.revived, revives: G.revives, win: isWin(s), lose: isLose(s),
    why: loseWhy(s), adSlot: adSlotOpen(s), screen: G.screen, paused: G.paused, frameErrors } : { screen: G.screen, paused: G.paused }; },
  play(n){ startLevel(Math.max(1, n || 1) - 1); return this.state(); },
  lab(k){ startLevel(LAB_AT + Math.max(1, k || 1) - 1); return this.state(); },   // пробный уровень с фигурным полем (1…LAB.length)
  move(cell, dir){ doMove(cell * 4 + (typeof dir === 'string' ? DIR_KEYS[dir] : dir)); return this.state(); },
  moves(){ return G.s ? legalMoves(G.s).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3], ...peekMove(G.s, m), kind: moveKind(G.s, m) })) : []; },
  pos(cell){ const g = geo(), q = cellXY(cell, g), r = cv.getBoundingClientRect(); return { x: r.left + (q.x + g.cell / 2) * scale, y: r.top + (q.y + g.cell / 2) * scale, cell: g.cell * scale }; },   // центр клетки в координатах окна — для проверки настоящим касанием
  magnet(){ useBoost('magnet'); return this.state(); },                       // бустеры и «Продолжить» — те же вызовы, что у кнопок
  broom(){ useBoost('broom'); return this.state(); },
  undoBoost(){ useBoost('undo'); return this.state(); },
  revive(){ doRevive(); return this.state(); },
  tray(v){ setTray(v); return G.save.tray; },
  deal(v){ setDeal(v); return G.save.deal; },                                   // режим раздачи: 'miss' | 'each' (со следующего старта уровня)
  adPos(){ if (!G.s || !adSlotOpen(G.s)) return null; const q = trayXY(G.s.cap, geo()), r = cv.getBoundingClientRect(); return { x: r.left + q.x * scale, y: r.top + q.y * scale }; },   // рекламная лунка в координатах окна
  slot(){ openTraySlot(); return this.state(); },                               // открыть рекламное место в лотке (как после ролика)                                   // вид лотка: 'groove' | 'side'
  boosts(n){ G.save.boost = { magnet: n, broom: n, undo: n }; save(); hud(); return G.save.boost; },   // задать запас бустеров (для проверки заглушки рекламы — 0)
  settings(){ openSettings(); return G.screen; },
  bot(policy, delayMs){                                                         // автоигра ботом ядра: greedy | docker | novice
    const step = () => { if (!G.s || G.screen !== 'game' || isWin(G.s) || isLose(G.s)) return; const r = mulberry32(G.s.moves + 5);
      doMove(policy === 'docker' ? dockerPick(G.s, r) : policy === 'novice' ? novicePick(G.s, r) : greedyPick(G.s)); setTimeout(step, delayMs || 400); };
    step(); return policy || 'greedy'; },
  undo(){ undo(); return this.state(); },                                       // отмена без списания бустера (отладка)
  goto(screen){ goto(screen); return G.screen; },
  solve(w){ return G.s ? (solve(G.s, w || CFG.SIM_BEAM) || []).map(m => ({ cell: m >> 2, dir: '→←↓↑'[m & 3] })) : null; },
  tempo(){ const t = G.save.tempo || []; console.table(t); return tempoLine(); },   // 19.11: темп — последние итоги уровней (сек, ходов) и секунд на ход
  hint(){ const p = G.s && solve(G.s, CFG.PAR_BEAM); return p && p.length ? { cell: p[0] >> 2, dir: '→←↓↑'[p[0] & 3] } : null; },
  auto(delayMs, width){ const p = (G.s && solve(G.s, width || CFG.SIM_BEAM)) || []; p.forEach((m, k) => setTimeout(() => doMove(m), (delayMs || 450) * (k + 1))); return p.length; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    const end = performance.now() + sec * 1000; let n = 0;
    while (performance.now() < end && n < 200000){ safeRender(); n++; }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  plan(name){ if (name && setLevelPlan(name)){ G.save.plan = name; save(); if (G.screen === 'menu') goto('menu'); } return CFG.LEVEL_PLAN + ' ' + LEVELS.length; },   // 19.11: линейка уровней v3 | dev | release | main
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};
